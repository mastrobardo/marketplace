# Staging. Always on, one machine, the same image production will promote.
app = "marketplace-api-staging"
primary_region = "cdg" # Paris — Fly has no Spain region (ADR-006); ~25ms from Madrid

[build]
  dockerfile = "../docker/api.Dockerfile"

[env]
  NODE_ENV = "production"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 8080
  force_https = true
  # Always one machine: staging answers the question "is it fixed on main?" and must not cold-start.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
