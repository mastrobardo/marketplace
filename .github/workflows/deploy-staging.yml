# W0-T07 — main on staging, and the one place an image is built.
#
# ADR-006: a production release promotes the artifact staging tested, so the image is built exactly
# once, here, and tagged with the commit SHA. `release-production.yml` then deploys that digest and
# has no build step at all — "it worked on staging" is only a meaningful sentence if it is a claim
# about the same bytes.
#
# THIS WORKFLOW HAS NEVER RUN — see deploy-preview.yml and W0-T24.

name: Deploy staging

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: staging
  cancel-in-progress: false # deploys queue; cancelling one mid-flight leaves staging indeterminate

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging
    outputs:
      configured: ${{ steps.guard.outputs.configured }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - id: guard
        run: pnpm exec tsx scripts/deploy/check.ts staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_BETTER_AUTH_SECRET: ${{ secrets.STAGING_BETTER_AUTH_SECRET }}
          STAGING_SEED_DEMO_PASSWORD: ${{ secrets.STAGING_SEED_DEMO_PASSWORD }}

  deploy:
    name: deploy
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # `1.5`, not `v1.5`: superfly/flyctl-actions tags its releases without the prefix, and
      # `v1.5` does not exist. It resolved to nothing and failed the job at "Set up job" —
      # invisible until now, because this job had never once got past the preflight gate.
      - uses: superfly/flyctl-actions/setup-flyctl@1.5

      # Built once, named by commit. Everything downstream refers to this digest and never to a
      # branch or a moving tag.
      - name: Build and push the API image
        run: |
          flyctl auth docker
          docker build --file infra/docker/api.Dockerfile --tag "$IMAGE" .
          docker push "$IMAGE"
        env:
          IMAGE: registry.fly.io/marketplace-api-staging:${{ github.sha }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Its own step, before the deploy, and never on application start-up. A bad migration should
      # be a failed step somebody can see, not a service that will not boot (ADR-006).
      - name: Migrate staging
        run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      # `W0-T30`, and the long version of why is in `deploy-preview.yml`. Staging matters more than
      # preview here for two reasons: it is what QA exercises, and it is the parent every preview
      # database is branched from — so a seeder that lands here lands in every future preview
      # before that workflow's own seed step even runs.
      #
      # Explicit ids, not the registry: what reaches staging should be readable in a diff.
      - name: Seed staging
        run: pnpm db:seed --only auth.demo-users,categories.taxonomy,providers.demo-world
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          # Required. `auth.demo-users` refuses a non-local host without it rather than write the
          # password that is committed to this repository — staging is on the public internet.
          SEED_DEMO_PASSWORD: ${{ secrets.STAGING_SEED_DEMO_PASSWORD }}

      # The API exits on boot without DATABASE_URL (`z.url()`, no default), and setting it on the
      # migrate step alone leaves the container without it. `--stage` holds it for the deploy below.

      # `turbo run`, not `pnpm --filter`: the web app became a runtime consumer of
      # `@marketplace/contracts` in `W12-T09`, and that package resolves to `dist/`. `pnpm --filter`
      # builds only the named package, so the import failed to resolve here while passing locally,
      # where `dist/` happened to exist. `turbo.json`'s `build` already declares `dependsOn: ["^build"]`.
      - name: Build the web app
        run: pnpm turbo run build --filter=@marketplace/web
        env:
          # No mocks flag, and no mocks: `W3-T01` shipped `GET /api/categories` and deleted MSW
          # whole. `VITE_API_ORIGIN` below points the edge at the real API.
          #
          # Staging holds the real taxonomy since `W0-T30` — the "Seed staging" step above — so
          # the category grid and facet rail render twenty trades rather than an empty state, and
          # QA has two accounts to sign in as. `deploy-preview.yml` carries the long version.
          # `W0-T28`. **Not `VITE_API_URL`**: that pointed the browser at Fly, a different
          # registrable domain from `*.pages.dev`, so every call was cross-origin and the
          # `SameSite=Lax` session cookie was never sent. `baseUrl()` now returns `/`, and this is
          # the origin the edge worker forwards `/api/*` to.
          VITE_API_ORIGIN: https://marketplace-api-staging.fly.dev

      # Direct, for the same reason as deploy-preview.yml: the action cannot install wrangler in a
      # pnpm workspace, and declaring it as a dependency breaks the API image build. AC34.
      # The URL is read back from wrangler, never constructed — `W0-T24`'s lesson, and `W0-T28`
      # gives it a second consumer: `BETTER_AUTH_URL` below. A guessed hostname would now do more
      # than send a reviewer to a dead link; it would hand better-auth a trusted-origin list that
      # does not contain the site, and every signed-in request would be a `403`.
      - name: Deploy the web app to Cloudflare Pages
        id: pages
        run: |
          set -euo pipefail
          npx --yes wrangler@3.90.0 pages deploy apps/web/dist \
            --project-name marketplace-web \
            --branch main 2>&1 | tee pages-deploy.log

          urls="$(sed -nE 's|.*(https://[a-zA-Z0-9.-]+\.pages\.dev).*|\1|p' pages-deploy.log)"

          alias_url=""
          for candidate in $urls; do
            case "$candidate" in
              "https://main."*)
                alias_url="$candidate"
                break
                ;;
            esac
          done
          deployment_url="$(printf '%s\n' "$urls" | head -1)"
          url="${alias_url:-$deployment_url}"

          if [ -z "$url" ]; then
            echo "wrangler printed no *.pages.dev URL — refusing to hand better-auth a guess." >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # `BETTER_AUTH_URL` is the **web** app's origin — `W0-T28`, and it does two jobs at once.
      #
      # better-auth builds its own endpoint URLs from it, so the verification link it emails is
      # `<web>/api/auth/verify-email?token=...`, which the edge worker forwards back here. And it is
      # what `trustedOrigins` defaults to, so it decides which `Origin` the API accepts on a
      # cookie-carrying POST. Pointed at Fly, both fail: no `Access-Control-Allow-Origin` for the
      # Pages host, and a cookie that is never sent because the two are different registrable
      # domains.
      #
      # Which is why the web app is deployed before this step rather than after it.
      # `W2-T10` §2.2 — `AUTH_TRUST_EMAIL_ON_SIGNUP` below is temporary, and deliberately set here
      # rather than defaulted in code. There is no mail provider in any deployed environment until
      # `OPS-14`, so without it every sign-up creates an account nobody can use; with it, an address
      # is trusted the moment somebody types it. The API warns about it at boot. Delete the line the
      # day a real sender exists.
      #
      # It sits *inside* the folded `run: >` block, so it carries no comment of its own: `#` is not
      # a comment character inside a folded scalar, and a note written there would be handed to
      # `flyctl` as arguments.
      - name: Give the API its database and its auth secret
        run: >
          flyctl secrets set
          DATABASE_URL="$DATABASE_URL"
          BETTER_AUTH_SECRET="$BETTER_AUTH_SECRET"
          BETTER_AUTH_URL="$BETTER_AUTH_URL"
          AUTH_TRUST_EMAIL_ON_SIGNUP="true"
          --app marketplace-api-staging --stage
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          # W2-T01 §4.8: required, no default. Without it the container exits 78 on boot.
          BETTER_AUTH_SECRET: ${{ secrets.STAGING_BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ steps.pages.outputs.url }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy the API
        run: flyctl deploy --app marketplace-api-staging --config infra/fly/api.staging.toml --image "$IMAGE"
        env:
          IMAGE: registry.fly.io/marketplace-api-staging:${{ github.sha }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # One request through the edge, for the reason `deploy-preview.yml` spells out: a worker that
      # failed to deploy is silent — `/api/*` falls through to `index.html` and the first symptom is
      # a JSON parse error in somebody's browser.
      - name: Check the API answers through the web origin
        run: |
          set -euo pipefail
          # `/api/auth/get-session` rather than `/health`: the API serves `/health` at its **root**,
          # and the edge only forwards `/api/*`. Measured, not assumed — `/api/health` is a 404 from
          # the API's own error envelope. This path is better anyway: a `200` with a `null` body
          # proves Pages served the worker, the worker resolved the origin, Fly answered, and
          # better-auth is mounted — which is the whole seam this ticket builds.
          # curl does the waiting: a machine that has just been deployed may still be starting, and
          # `--retry-all-errors --retry-connrefused` covers both "not listening yet" and a 5xx while
          # it boots. A hand-rolled loop would need `sleep`, which this job has no reason to install.
          status="$(curl -sS --retry 5 --retry-delay 5 --retry-all-errors --retry-connrefused \
            -o body.json -w '%{http_code}' "$WEB_URL/api/auth/get-session")"
          echo "$WEB_URL/api/auth/get-session -> $status"
          echo "body: $(head -c 300 body.json)"
          if [ "$status" != "200" ]; then
            echo "The API is not reachable through the web origin: the edge worker did not deploy," >&2
            echo "or it is pointed at an origin that is not answering." >&2
            exit 1
          fi
        env:
          WEB_URL: ${{ steps.pages.outputs.url }}

      # W12-T06. On merge as well as per pull request, so the workbench a reviewer is sent to for
      # "how is this component supposed to look" is the one that is actually on `main` — not
      # whichever branch deployed it last.
      - name: Build the component workbench
        run: pnpm --filter @marketplace/ui build:storybook

      - name: Deploy the workbench to Cloudflare Pages
        run: |
          npx --yes wrangler@3.90.0 pages deploy packages/ui/storybook-static \
            --project-name marketplace-ui \
            --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
