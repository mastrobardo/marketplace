# W0-T06 — the gate every pull request passes before a human spends attention on it.
#
# Seven checks, one per failure class, each its own job so a red PR says *which* class of thing
# broke without anyone opening a log. The names are a contract: `W0-T13` requires them by name in
# branch protection, and GitHub matches by name — renaming a job here silently removes a required
# check and reports nothing. Rename one, update branch protection in the same change.
#
# One of the seven, `gates`, is itself four gates (`W0-T29`): four jobs running the same script
# with a different argument paid four setup taxes and billed four minutes for eight seconds of
# work. A job earns its own name by having its own *setup*, not merely its own failure class —
# `gates` reports which of its four failed by annotation and in the run summary.
#
# Every gate runs the same `pnpm` script an agent runs locally. That is deliberate: a CI-only
# variant command is how "green on my laptop" and "green in CI" become two different things to
# satisfy, and then two different things to debug.

name: CI

on:
  # Every pull request, whatever it targets. Restricting to `base: main` would leave a stacked PR
  # — one feature branch reviewed on top of another — with no checks at all, which is exactly when
  # a reviewer most wants them. `push` stays limited to `main`, so a branch push is checked once,
  # by its pull request, rather than twice.
  pull_request:
  push:
    branches: [main]

# Read-only, and nothing here needs more. A workflow with a write token or a secret cannot safely
# run on a pull request from a fork.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; `main` is not. A cancelled `main` build leaves `main`
  # unverified, which is the one state this workflow exists to prevent.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Formatting is the same class of failure — "the code is not shaped right" — so it belongs in
      # the same check rather than costing another runner.
      - run: pnpm format:check

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # `packages/ui`'s stories run as Vitest browser tests (ADR-012 §5), so this job needs a real
      # browser. It is installed here rather than in a job of its own because that is the whole
      # point of the addon: the existing runner, the existing job, one `pnpm test`. A separate
      # script is a suite that stops running the first time someone forgets to call it.
      - name: Install the browser the story tests run in
        run: pnpm --filter @marketplace/ui exec playwright install --with-deps chromium

      - run: pnpm test

  # W12-T15. Lighthouse over the storefront, reported into the run recap — never a merge gate.
  #
  # Performance is not a blocker in the MVP phase (operator, 2026-09-12): the harness exists so a
  # regression is *visible* on the pull request that caused it, not so a pull request fails over
  # drift nobody is experiencing. `perf/run.mjs` exits 0 on a shortfall by construction, and
  # `perf-budget.test.ts` asserts that it does.
  #
  # **Do not add this job to branch protection.** Every other job in this file is a gate and the
  # names are a contract (`W0-T13`); this one is not, and making it required in repository settings
  # would reverse a product decision through a settings change rather than a reviewed one.
  perf:
    name: perf
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # The same Playwright Chromium the story tests use, pinned by `pnpm-lock.yaml`, rather than
      # whatever Chrome the runner image happens to ship this week. A browser update that moves
      # every number at once is otherwise indistinguishable from a regression — `W12-T16` learned
      # that as `fingerprint.json`, and the recap prints the version for the same reason.
      - name: Install the browser Lighthouse drives
        run: pnpm --filter @marketplace/ui exec playwright install --with-deps chromium

      - name: Resolve the browser path
        id: browser
        run: |
          set -euo pipefail
          path="$(pnpm --filter @marketplace/ui exec node -e \
            'process.stdout.write(require("playwright").chromium.executablePath())')"
          test -x "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Build the storefront
        run: pnpm turbo run build --filter=@marketplace/web

      # `$GITHUB_STEP_SUMMARY` is what puts the table in the run recap. The script appends rather
      # than truncates, so it cannot delete another step's contribution to the same file.
      - name: Measure
        run: >
          pnpm --filter @marketplace/web perf --
          --markdown "$GITHUB_STEP_SUMMARY"
          --screenshots perf-screenshots
        env:
          CHROME_PATH: ${{ steps.browser.outputs.path }}

      # Only written when something fell below a floor, so an upload here means there is something
      # to look at. A recap that says a page got slower does not say what the user saw; the
      # filmstrip does, frame by frame, named by the millisecond it painted.
      #
      # `if-no-files-found: ignore` because the healthy case produces nothing — a warning on every
      # green run is a warning nobody reads on the red one.
      - name: Attach the images from any shortfall
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-screenshots
          path: apps/web/perf-screenshots/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  database:
    name: database
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # The project's own compose stack, not a bespoke service container. One Postgres definition,
      # one version, one code path — and it means the compose file is itself exercised on every PR
      # instead of drifting until the next developer's `pnpm stack:up` fails.
      - name: Start the local stack
        run: pnpm stack:up

      - name: Apply migrations
        run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: postgres://marketplace:marketplace_local@127.0.0.1:5432/marketplace

      # The criteria W0-T02 and W0-T05 could only assert against a running stack. Without this job
      # they are skipped everywhere, forever, and the suite quietly measures less than it claims.
      #
      # **Not a list of files.** This named three suites by hand until `W2-T01`, whose 20 live auth
      # tests would have been written, passed locally, and then never run here — the same shape as
      # the hand-written migration list that ticket also had to fix, and the fourth instance in this
      # repo of a subject list that silently measures less than it claims.
      #
      # Running the whole `apps/api` suite with `STACK_LIVE=1` derives the set instead: a live
      # suite added tomorrow runs here on the day it lands. The DOM-free tests run twice — once in
      # `unit`, once here — which costs a few seconds and removes a whole class of omission.
      # These suites call `vitest` directly rather than through `pnpm test`, so turbo's
      # `dependsOn: ["^build"]` never runs and `@marketplace/contracts` resolves to a `dist/` that
      # does not exist. It went unnoticed while the job named three suites that happened not to
      # import it; running the whole suite surfaced it immediately.
      #
      # `@marketplace/api^...` is turbo for "this package's dependencies, not the package itself" —
      # derived, so a new workspace dependency is built here without anyone remembering to add it.
      - name: Build the packages the suites import
        run: pnpm turbo run build --filter='@marketplace/api^...'

      - name: Run the live suites
        run: |
          pnpm vitest run tests/local-stack.test.ts
          pnpm --filter @marketplace/api exec vitest run
        env:
          STACK_LIVE: '1'
          DATABASE_URL: postgres://marketplace:marketplace_local@127.0.0.1:5432/marketplace
          # W2-T01 §4.8 — `loadConfig` refuses the whole environment without these, so every
          # `apps/api` suite that builds a Config needs them, live or not. Test values: this
          # database is a throwaway container and no session outlives the job.
          BETTER_AUTH_SECRET: ci-test-secret-at-least-thirty-two-chars
          BETTER_AUTH_URL: http://127.0.0.1:5173

      # Not `pnpm stack:logs` — that script follows, which would hang the job until its timeout.
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail=200

  workflows:
    name: workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      # CI that cannot lint itself is CI nobody can change safely: a typo in a `uses:` or an
      # unquoted expression fails at run time, on someone else's pull request.
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  # ── The gates AGENTS.md, TODO.md §5.5 and IDENTITY.md promise ────────────────────────────────
  #
  # W0-T12/T15/T21 wrote them; each had been documented as enforced long before it existed, so the
  # repo asked every agent to police itself and reported success either way.
  #
  # W0-T29 made them **one job**. They were four, and each paid ~30s of checkout, setup-node and
  # `pnpm install` to run ~2s of gate — then billed a whole minute, because GitHub rounds every job
  # up. Across this repo's first 273 runs that was 345 wasted minutes and three runner slots per
  # push that the jobs a reviewer is actually waiting on could have used.
  #
  # What four job names bought was legibility: a red pull request named *which* gate failed without
  # anyone opening a log. `scripts/gates/run.ts --all` buys it back with an `::error` annotation per
  # failing gate and a table in the run summary, and adds something the four jobs never had — every
  # gate is judged in one invocation, so a branch that breaks two of them learns both at once.
  #
  # **`gates` is one name in branch protection where there were four** (spec §4). `OPS-03` has not
  # run, so this is the cheapest moment this choice will ever be available.
  #
  # No `if:` on it (AC8): a conditional job reports "skipped", and GitHub counts a skipped required
  # check as satisfied — a gate that can vanish is not a gate. On a push to `main` there is no base
  # ref and no labels, so the three pull-request gates report "not a pull request" themselves, which
  # is an honest answer rather than an absent one, and `agents-drift` still runs.
  gates:
    name: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # The diff is against the base branch, and the identity walk needs the whole range —
          # neither is in a shallow clone. With the default depth the gates see no changed files
          # and no commits, and pass every branch.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm gates
        env:
          # A JSON array. Passed through `env:` rather than interpolated into the `run:` string, so
          # a label containing shell metacharacters cannot become a command — and JSON rather than a
          # delimiter, because GitHub labels may legally contain both commas and spaces.
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
