# W0-T07 — destroy a preview when its pull request closes.
#
# `closed` fires for merged and abandoned pull requests alike, which is what makes the bill a
# function of *open* PRs rather than of PRs ever opened.
#
# Every destroy tolerates an absent resource. A teardown that fails because the thing was already
# gone is a teardown that gets re-run and leaves the *other* resources alive, billing — so the
# `|| true` here is deliberate, and is the one place in this repo where it is.
#
# Live since W0-T24 — see deploy-preview.yml.

name: Destroy preview

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  deployments: write

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: false # never cancel a teardown; a cancelled one leaks resources

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: preview
    outputs:
      configured: ${{ steps.guard.outputs.configured }}
      app: ${{ steps.guard.outputs.app }}
      db-branch: ${{ steps.guard.outputs.db-branch }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - id: guard
        run: pnpm exec tsx scripts/deploy/check.ts preview "$PR_NUMBER"
        env:
          PR_NUMBER: ${{ github.event.number }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}

  destroy:
    name: destroy
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: preview
    steps:
      # `1.5`, not `v1.5`: superfly/flyctl-actions tags its releases without the prefix, and
      # `v1.5` does not exist. It resolved to nothing and failed the job at "Set up job" —
      # invisible until now, because this job had never once got past the preflight gate.
      - uses: superfly/flyctl-actions/setup-flyctl@1.5

      # Installed for the same reason as in deploy-preview.yml, and it matters more here: paired
      # with the deliberate `|| true` below, a missing neonctl made every teardown green while the
      # database branch it was supposed to delete stayed alive and billing.
      - name: Install neonctl
        run: npm install --global neonctl@4.14.5

      - name: Destroy the Fly app
        run: flyctl apps destroy "$APP" --yes || true
        env:
          APP: ${{ needs.preflight.outputs.app }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Delete the preview database branch
        run: |
          neonctl branches delete "$DB_BRANCH" \
            --project-id "$NEON_PROJECT_ID" || true
        env:
          DB_BRANCH: ${{ needs.preflight.outputs.db-branch }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
