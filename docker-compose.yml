# Local development stack — W0-T02.
#
# One command, three dependencies, no cloud account:
#   pnpm stack:up      start and wait until every service is actually usable
#   pnpm stack:down    stop, keeping data
#   pnpm stack:reset   stop and destroy the volumes
#
# Every port is bound to 127.0.0.1 on purpose. A laptop on a café network must not be serving
# Postgres. Each host port is overridable, because a developer machine very often already has a
# Postgres on 5432 from another project; set POSTGRES_PORT / MAIL_SMTP_PORT / MAIL_HTTP_PORT /
# OBJECTS_PORT / OBJECTS_ADMIN_PORT in a local `.env` (gitignored) and nothing else changes —
# every service still reaches its neighbours by container name on the compose network.
#
# The credentials below are local-development placeholders and are the only credentials
# that will ever appear in this file — real values live in Fly/GitHub environment secrets
# (docs/adr/ADR-006), never in the repo.

name: marketplace

services:
  # ---------------------------------------------------------------------------------------------
  # Postgres + PostGIS. Mirrors the Neon Postgres 17 that ADR-006 puts in every other environment.
  #
  # Image note: `postgis/postgis` publishes amd64 only. `imresamu/postgis` is the multi-architecture
  # build from the same maintainer, linked from postgis/docker-postgis as the arm64 source. Switch
  # back when the canonical repository publishes arm64 itself.
  # ---------------------------------------------------------------------------------------------
  db:
    image: imresamu/postgis:17-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace_local
      POSTGRES_DB: marketplace
      # Deterministic collation, so ORDER BY sorts the same here as on Neon.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=es-ES --encoding=UTF8'
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -d matters: without it pg_isready reports ready while the init scripts are still running.
      test: ['CMD-SHELL', 'pg_isready -U marketplace -d marketplace']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ---------------------------------------------------------------------------------------------
  # Mail catcher. Accepts every message, delivers none, and exposes a JSON API so "an email was
  # sent" is an assertion rather than an assumption.
  #
  # Image note: TODO.md §6 names MailHog. MailHog is archived and ships amd64 only; Mailpit is its
  # maintained successor, multi-architecture, same SMTP-catcher + HTTP-API shape.
  # ---------------------------------------------------------------------------------------------
  mail:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: '5000'
      MP_DATABASE: /data/mailpit.db
      # No relay is configured, so there is no path by which a test email reaches a real person.
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '127.0.0.1:${MAIL_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAIL_HTTP_PORT:-8025}:8025'
    volumes:
      - mail-data:/data
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------------------------
  # S3-compatible object storage, standing in for the Cloudflare R2 that ADR-006 chose for staging
  # and production.
  #
  # **This is Garage, because MinIO no longer exists as something a project can depend on** (W0-T33).
  # The history is three registry moves and one archival: `#237` moved these images off Docker Hub
  # after MinIO deleted the repositories; `#292` moved them off quay.io — MinIO's own registry —
  # after anonymous pulls started answering `unauthorized`; and the reason there was nowhere left to
  # move to is that the projects themselves are gone. `dl.min.io` answers **410 Gone** with
  # "The open-source MinIO Server, MinIO Client (mc) and MinIO KES projects are archived and no
  # longer maintained… does not provide security updates, or security advisories", and both GitHub
  # repositories report `archived: true`. Every MinIO image in existence, including the Bitnami
  # build `#292` pinned to unblock the stack, is therefore frozen for good — which is why
  # authenticating to quay with a robot account was never the answer: the credential buys an
  # unmaintained server.
  #
  # Garage is maintained (v2.4.1, September 2026), public, multi-arch, and purpose-built as an
  # S3-compatible object store. Two consequences show up below:
  #
  #   - **The image is built here** (`docker/garage/Dockerfile`), not pulled. Upstream ships
  #     `FROM scratch` — the binary and nothing else, no shell — and both the server and the
  #     provisioner need one. The binary is upstream's, copied verbatim from a pinned digest.
  #   - **The ports are Garage's**: S3 on 3900, admin API on 3903. `OBJECTS_PORT` still publishes
  #     the S3 API on 9000 by default, so nothing outside this file had to learn a new number.
  #     There is no web console to replace MinIO's, so `OBJECTS_CONSOLE_PORT` became
  #     `OBJECTS_ADMIN_PORT`.
  # ---------------------------------------------------------------------------------------------
  objects:
    image: marketplace/objects:2.4.1
    build:
      context: ./docker/garage
    restart: unless-stopped
    ports:
      - '127.0.0.1:${OBJECTS_PORT:-9000}:3900'
      - '127.0.0.1:${OBJECTS_ADMIN_PORT:-9001}:3903'
    volumes:
      # Metadata is an LMDB database and data is content-addressed blocks: two directories, and so
      # two named volumes. `objects-init` mounts the metadata one read-only to read this node's id.
      - objects-meta:/var/lib/garage/meta
      - objects-data:/var/lib/garage/data
    healthcheck:
      # `garage health` exits 0 only once the cluster can actually serve reads and writes, and 1
      # before that — which is strictly later than the process being up, because a fresh node has no
      # layout yet. Checked against the pinned binary rather than assumed: in that window the admin
      # endpoint answers 503 and this command exits 1, so "healthy" means usable (AC4).
      test: ['CMD', 'garage', 'health']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ---------------------------------------------------------------------------------------------
  # One-shot provisioning of the S3 key and the bucket. Runs to completion and exits; `stack:up
  # --wait` tolerates that because the container is expected to stop with exit code 0.
  #
  # The same image as the server, because the work is `garage` CLI calls — see
  # `docker/garage/provision.sh` for why the credentials live there rather than in this file, and
  # why running it twice is safe. The cluster layout is **not** provisioned here: a node without one
  # is unhealthy, and this service waits for health, so it would be waiting for itself.
  # ---------------------------------------------------------------------------------------------
  objects-init:
    image: marketplace/objects:2.4.1
    build:
      context: ./docker/garage
    depends_on:
      objects:
        condition: service_healthy
    volumes:
      # Read-only, and read exactly once: `garage node id` needs the node's public key from the
      # metadata directory to address admin commands at it. Nothing writes through this mount.
      - objects-meta:/var/lib/garage/meta:ro
    entrypoint: ['/usr/local/bin/provision.sh']

volumes:
  db-data:
  mail-data:
  objects-meta:
  objects-data:
